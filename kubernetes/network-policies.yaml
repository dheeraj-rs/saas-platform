apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enterprise-saas-app-netpol
  namespace: enterprise-saas
spec:
  podSelector:
    matchLabels:
      app: enterprise-saas
      component: app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from ingress controllers
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: istio-system
    ports:
    - protocol: TCP
      port: 3000
  # Allow traffic from monitoring systems
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 3000
  # Allow inter-pod communication within the namespace
  - from:
    - podSelector:
        matchLabels:
          app: enterprise-saas
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS traffic (for external APIs, OAuth, etc.)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP traffic (for health checks, webhooks)
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow MongoDB connections
  - to: []
    ports:
    - protocol: TCP
      port: 27017
  # Allow Redis connections
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow communication with other services in the namespace
  - to:
    - podSelector:
        matchLabels:
          app: enterprise-saas

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: enterprise-saas
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: enterprise-saas
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow connections from the main application
  - from:
    - podSelector:
        matchLabels:
          app: enterprise-saas
          component: app
    ports:
    - protocol: TCP
      port: 6379
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-access
  namespace: enterprise-saas
spec:
  podSelector:
    matchLabels:
      app: enterprise-saas
  policyTypes:
  - Ingress
  ingress:
  # Allow Prometheus scraping
  - from:
    - namespaceSelector:
         
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 3000
  # Allow Grafana access
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 3000

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: enterprise-saas-mtls
  namespace: enterprise-saas
spec:
  selector:
    matchLabels:
      app: enterprise-saas
  mtls:
    mode: STRICT

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: enterprise-saas-authz
  namespace: enterprise-saas
spec:
  selector:
    matchLabels:
      app: enterprise-saas
      component: app
  rules:
  # Allow traffic from ingress gateway
  - from:
    - source:
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
  # Allow traffic from monitoring
  - from:
    - source:
        namespaces: ["monitoring"]
  # Allow inter-service communication
  - from:
    - source:
        principals: ["cluster.local/ns/enterprise-saas/sa/enterprise-saas-app"]

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: enterprise-saas-vs
  namespace: enterprise-saas
spec:
  hosts:
  - "your-domain.com"
  - "api.your-domain.com"
  gateways:
  - enterprise-saas-gateway
  http:
  # API routes
  - match:
    - uri:
        prefix: "/api/"
    route:
    - destination:
        host: enterprise-saas-app-service
        port:
          number: 80
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
  # Health check routes (no authentication required)
  - match:
    - uri:
        exact: "/health"
    - uri:
        exact: "/health/ready"
    route:
    - destination:
        host: enterprise-saas-app-service
        port:
          number: 80
  # All other routes
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: enterprise-saas-app-service
        port:
          number: 80
    timeout: 60s

---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: enterprise-saas-gateway
  namespace: enterprise-saas
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "your-domain.com"
    - "api.your-domain.com"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: enterprise-saas-tls
    hosts:
    - "your-domain.com"
    - "api.your-domain.com"

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: enterprise-saas-dr
  namespace: enterprise-saas
spec:
  host: enterprise-saas-app-service
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
    loadBalancer:
      simple: LEAST_CONN
    outlierDetection:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50

---
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-saas-tls
  namespace: istio-system
type: kubernetes.io/tls
data:
  tls.crt: # Base64 encoded certificate
  tls.key: # Base64 encoded private key
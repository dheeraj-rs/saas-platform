apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-saas-app
  namespace: enterprise-saas
  labels:
    app: enterprise-saas
    component: app
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: enterprise-saas
      component: app
  template:
    metadata:
      labels:
        app: enterprise-saas
        component: app
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: enterprise-saas-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/enterprise-saas/app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: NEXTAUTH_URL
          valueFrom:
            configMapKeyRef:
              name: enterprise-saas-config
              key: NEXTAUTH_URL
        envFrom:
        - secretRef:
            name: enterprise-saas-secrets
        - configMapRef:
            name: enterprise-saas-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.next/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - enterprise-saas
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-saas-app-service
  namespace: enterprise-saas
  labels:
    app: enterprise-saas
    component: app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:us-east-1:123456789012:certificate/12345678-1234-1234-1234-123456789012"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  selector:
    app: enterprise-saas
    component: app
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-saas-config
  namespace: enterprise-saas
data:
  NEXTAUTH_URL: "https://your-domain.com"
  REDIS_URL: "redis://redis-service:6379"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW: "60000"
  RATE_LIMIT_REQUESTS: "100"

---
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-saas-secrets
  namespace: enterprise-saas
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://username:password@cluster.mongodb.net/database"
  JWT_SECRET: "your-super-secure-jwt-secret"
  NEXTAUTH_SECRET: "your-nextauth-secret"
  ENCRYPTION_KEY: "your-32-character-encryption-key"
  GOOGLE_CLIENT_ID: "your-google-oauth-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-oauth-client-secret"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-saas-app
  namespace: enterprise-saas
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/enterprise-saas-pod-role"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enterprise-saas-app
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["*"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enterprise-saas-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enterprise-saas-app
subjects:
- kind: ServiceAccount
  name: enterprise-saas-app
  namespace: enterprise-saas

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-saas-app-hpa
  namespace: enterprise-saas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-saas-app
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: enterprise-saas-app-pdb
  namespace: enterprise-saas
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: enterprise-saas
      component: app

---
apiVersion: v1
kind: Namespace
metadata:
  name: enterprise-saas
  labels:
    name: enterprise-saas
    istio-injection: enabled
  annotations:
    scheduler.alpha.kubernetes.io/node-selector: "tier=application"